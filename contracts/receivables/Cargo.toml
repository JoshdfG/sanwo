[package]
name = "receivables"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Tests deploy the real pool. Kept out of [dependencies] so the pool's
# functions are not compiled into the Receivables contract.
capital-pool = { path = "../capital-pool" }
